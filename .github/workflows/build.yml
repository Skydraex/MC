name: Build Plugin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build with Maven
        id: build
        continue-on-error: true
        run: mvn -B clean package > build_output.txt 2>&1
      - name: Save log on failure
        if: steps.build.outcome == 'failure'
        run: |
          git config user.email "ci@local"
          git config user.name "CI Bot"
          cp build_output.txt BUILD_LOG.txt
          git add BUILD_LOG.txt
          git commit -m "Add build failure log [skip ci]"
          git push
      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
      - name: Upload built plugin
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: PrisonPlugin
          path: target/PrisonPlugin.jar
          if-no-files-found: error
