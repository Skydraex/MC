name: Build Plugin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Discover available paper-api versions
        run: |
          curl -s "https://repo.papermc.io/repository/maven-public/io/papermc/paper/paper-api/maven-metadata.xml" -o /tmp/paper-versions.xml || true
          echo "--- paper-api maven-metadata.xml ---" > AVAILABLE_VERSIONS.txt
          cat /tmp/paper-versions.xml >> AVAILABLE_VERSIONS.txt 2>/dev/null || echo "fetch failed" >> AVAILABLE_VERSIONS.txt
          git config user.email "ci@local"
          git config user.name "CI Bot"
          git add AVAILABLE_VERSIONS.txt
          git commit -m "Record available paper-api versions [skip ci]" || true
          git push || true
      - name: Build with Maven
        id: build
        continue-on-error: true
        run: mvn -B clean package > build_output.txt 2>&1
      - name: Save log on failure
        if: steps.build.outcome == 'failure'
        run: |
          git config user.email "ci@local"
          git config user.name "CI Bot"
          cp build_output.txt BUILD_LOG.txt
          git add BUILD_LOG.txt
          git commit -m "Add build failure log [skip ci]"
          git push
      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
      - name: Upload built plugin
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: PrisonPlugin
          path: target/PrisonPlugin.jar
          if-no-files-found: error
