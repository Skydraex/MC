name: Build Plugin

on:
  push:
    # Development branches build too, so a rewrite can be proved green before it
    # reaches main rather than after.
    branches: [ main, master, 'claude/**' ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Map connectivity check
        id: mapcheck
        continue-on-error: true
        run: python3 tools/map_check.py > map_check_output.txt 2>&1
      - name: Save map-check log and fail on gap/overlap
        if: steps.mapcheck.outcome == 'failure' && github.ref == 'refs/heads/main'
        run: |
          cat map_check_output.txt
          git config user.email "ci@local"
          git config user.name "CI Bot"
          cp map_check_output.txt MAP_CHECK_LOG.txt
          git add MAP_CHECK_LOG.txt
          git commit -m "Add map-check failure log [skip ci]"
          git push
          exit 1
      - name: Fail if the map check failed
        if: steps.mapcheck.outcome == 'failure'
        run: |
          cat map_check_output.txt
          exit 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build with Maven
        id: build
        continue-on-error: true
        run: mvn -B clean package > build_output.txt 2>&1
      # Maven's output is redirected to a file, so on a failure it has to be printed
      # or the job log shows nothing but "exit code 1". This runs on every branch;
      # only the commit-the-log-back step below is restricted to main.
      - name: Show the build errors
        if: steps.build.outcome == 'failure'
        run: |
          echo "----- [ERROR] lines -----"
          grep -E "^\[ERROR\]" build_output.txt | head -60 || true
          echo "----- full tail -----"
          tail -80 build_output.txt
      - name: Save log on failure
        if: steps.build.outcome == 'failure' && github.ref == 'refs/heads/main'
        run: |
          git config user.email "ci@local"
          git config user.name "CI Bot"
          cp build_output.txt BUILD_LOG.txt
          git add BUILD_LOG.txt
          git commit -m "Add build failure log [skip ci]"
          git push
      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
      - name: Upload built plugin
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: PrisonPlugin
          path: target/PrisonPlugin.jar
          if-no-files-found: error
