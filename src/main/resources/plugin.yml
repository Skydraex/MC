name: PrisonPlugin
version: 1.0.0
main: com.lukeprison.prison.PrisonPlugin
api-version: '26.2'
depend: [Vault]
commands:
  rankup:
    description: Open the ranks menu and rank up
  rank:
    description: Show your current rank and progress
  prestige:
    description: Prestige once you reach Free
  prison:
    description: Open the main prison menu
    aliases: [menu, pmenu]
  warps:
    description: Teleport to an unlocked mine
    aliases: [mines, warp]
  enchant:
    description: Spend tokens on pickaxe enchants
    aliases: [enchants, ce]
  tokens:
    description: Check your token balance
    aliases: [token, bal-tokens]
  autosell:
    description: Toggle selling blocks instantly as you mine
    aliases: [as]
  fishing:
    description: Open the fishing pond menu
    aliases: [fish, ponds]
  sellfish:
    description: Sell all fish in your inventory
    aliases: [sf]
  spawn:
    description: Return to the prison hub
    aliases: [hub]
  coinflip:
    description: Open coinflips, or create one with an amount
    aliases: [cf, flip]
permissions:
  prison.admin:
    default: op
