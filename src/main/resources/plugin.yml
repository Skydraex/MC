name: PrisonPlugin
version: 1.0.0
main: com.lukeprison.prison.PrisonPlugin
api-version: '26.2'
depend: [Vault]
commands:
  rankup:
    description: Open the ranks menu and rank up
  rank:
    description: Show your current rank and progress
  prestige:
    description: Prestige once you reach Free
  prison:
    description: Open the main prison menu
    aliases: [menu, pmenu]
  warps:
    description: Teleport to an unlocked mine
    aliases: [mines, warp]
  mine:
    description: Warp straight to a mine (your rank or below) - e.g. /mine C
    usage: /mine <rank>
  enchant:
    description: Apply enchants to your pickaxe, at the enchanter
    aliases: [enchants, ce]
  autosell:
    description: Toggle selling blocks instantly as you mine
    aliases: [as]
  rules:
    description: Read the server rules
  vote:
    description: How to vote, and what you get for it
  fishing:
    description: Open the fishing pond menu
    aliases: [fish, ponds]
  sellfish:
    description: Sell all fish in your inventory
    aliases: [sf]
  spawn:
    description: Return to the prison hub
    aliases: [hub]
  coinflip:
    description: Open coinflips, or create one with an amount
    aliases: [cf, flip]
  prisonadmin:
    description: Admin and testing tools
    aliases: [padmin]
    permission: prison.admin
  daily:
    description: Claim your daily reward
  top:
    description: View leaderboards - money, blocks, prestige, fishing
    aliases: [leaderboard, baltop]
  sell:
    description: Sell every mine block in your inventory
  cell:
    description: Claim, visit, or release your cell
  shop:
    description: Open the server shop
    aliases: [store]
permissions:
  # The staff ladder. Each rung inherits the one below it, so granting
  # prison.staff.admin carries Helper and Moderator with it.
  #
  # Anything that puts an item or a balance into a player's hands sits at
  # superadmin or above, on purpose: it is the one kind of staff abuse that
  # cannot be undone, because the items are spent or traded before anyone looks.
  prison.staff.helper:
    description: Look up players, warn, see who is on staff
    default: false
  prison.staff.mod:
    description: Mute and kick
    default: false
    children:
      prison.staff.helper: true
  prison.staff.admin:
    description: Set ranks, reset players, run the map check
    default: op
    children:
      prison.staff.mod: true
  prison.staff.superadmin:
    description: Hand out keys, gear and money
    default: false
    children:
      prison.staff.admin: true
  prison.staff.owner:
    description: Everything, including rebuilding the world
    default: false
    children:
      prison.staff.superadmin: true
  prison.admin:
    description: Legacy node, treated as Admin
    default: op
